[project]
name = "agentic-rag"
version = "0.1.0"
description = "Advanced Agentic RAG Platform — autonomous knowledge retrieval, evidence gathering, verification, and grounded answer generation."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Added in later phases: PyMuPDF, python-docx, beautifulsoup4, sentence-transformers,
# opentelemetry-sdk, prometheus-client, testcontainers — only when the phase that needs
# them actually lands, per "do not add dependencies unless they solve a concrete requirement."

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: storage/postgres.py and storage/cache.py cache the
# engine/session-factory/redis-client at module (process) level, matching how
# the real app runs under uvicorn (one event loop for the process lifetime).
# Per-test loops would make later tests reuse a pool bound to an already-closed
# loop from an earlier test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
