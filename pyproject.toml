[project]
name = "agentic-rag"
version = "0.1.0"
description = "Advanced Agentic RAG Platform — autonomous knowledge retrieval, evidence gathering, verification, and grounded answer generation."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Added in later phases: PyMuPDF, python-docx, beautifulsoup4, sentence-transformers,
# opentelemetry-sdk, prometheus-client, testcontainers — only when the phase that needs
# them actually lands, per "do not add dependencies unless they solve a concrete requirement."

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: storage/postgres.py and storage/cache.py cache the
# engine/session-factory/redis-client at module (process) level, matching how
# the real app runs under uvicorn (one event loop for the process lifetime).
# Per-test loops would make later tests reuse a pool bound to an already-closed
# loop from an earlier test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Form()/File()/Query() in argument defaults is the
# idiomatic pattern the framework is built around, not the mutable-default
# footgun B008 targets.
"src/agentic_rag/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# PyMuPDF and sentence-transformers ship without type stubs/py.typed; every
# call into them looks "untyped" to strict mypy regardless of how this
# module's own code is typed.
module = [
    "agentic_rag.ingestion.parsers.pdf",
    "agentic_rag.embeddings.local",
    "agentic_rag.retrieval.reranking",
]
disallow_untyped_calls = false
warn_return_any = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
